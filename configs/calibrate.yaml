# Prompt 13: temperature scaling and "NEI when unsure" (owner M4). Uses the NLI cache of Prompt 12.
run_name: calibration
seed: 42
test_subset: full

paths:
  outputs_dir: outputs
  search_dirs: [data, outputs, /kaggle/input]

calibration:
  model: cross-encoder/nli-deberta-v3-base
  fp16: true
  max_length: 512
  batch_size: 64
  evidence: {type: chain, run: chain}    # the "Hybrid + 2-hop + NLI" pipeline
  threshold_grid: [0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95]
  tau_min: 0.3
  tau_max: 0.9
  tau_step: 0.05
