# Prompt 10: optional cross-encoder rerank of the hybrid top 50 (owner M2). Needs a GPU.
run_name: rerank
seed: 42
test_subset: full

paths:
  outputs_dir: outputs
  search_dirs: [data, outputs, /kaggle/input]

rerank:
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  input_run: hybrid
  top_n: 50
  batch_size: 256
  max_length: 256
  fp16: true
  ks: [5, 10, 20]
  latency_queries: 100
  default_noise: 0.005       # used only if the second-seed run is missing
