# Prompt 11: two-hop evidence chain (owner M3). GPU preferred (HotpotQA encoding), CPU works.
run_name: chain
seed: 42
test_subset: full

paths:
  outputs_dir: outputs
  search_dirs: [data, outputs, /kaggle/input]

chain:
  hop1_run: auto             # auto = reranked hybrid if Prompt 10 kept the reranker, else hybrid
  dense_model: models/minilm_ft
  dense_run: dense_ft        # corpus embeddings of the fine-tuned model
  budget: 5                  # sentences per chain = what the FEVER scorer reads
  bridge_from: 3             # bridge entities come from the top 3 hop-1 sentences
  max_bridges: 2
  hop2_k: 2                  # at most 2 hop-2 sentences replace the last hop-1 sentences
  search_k: 20               # hop-2 sentences fetched per bridge before the threshold
  thresholds: [0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 1.01]   # 1.01 = never use hop 2
  spacy_model: en_core_web_sm
  hotpot:
    budget: 4
    hop2_k: 2
    bridge_from: 2
    max_bridges: 2
    tune_questions: 500      # threshold tuned on the first 500 questions, results on the other 6,905
    thresholds: [0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 1.01]
    max_questions: null      # set e.g. 1000 for a quick run
