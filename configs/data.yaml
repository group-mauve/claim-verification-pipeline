# Phase 1 config: download, splits and restricted corpus (Prompts 1-3).
# Paths are relative to the repository root unless they start with "/".

run_name: data_v1
seed: 42

paths:
  raw_dir: data/raw                  # downloaded files land here
  wiki_parquet_dir: data/wiki_sentences
  splits_dir: data/splits
  corpus_dir: data/corpus
  outputs_dir: outputs
  # Folders searched (recursively) for an existing copy of each raw file before
  # downloading. On Kaggle, any dataset you "Add input" appears under /kaggle/input.
  search_dirs:
    - data/raw
    - .
    - /kaggle/input

download:
  # Official FEVER release (fever.ai) with the older S3 bucket as a fallback.
  files:
    train.jsonl:
      - https://fever.ai/download/fever/train.jsonl
      - https://s3-eu-west-1.amazonaws.com/fever.public/train.jsonl
    shared_task_dev.jsonl:
      - https://fever.ai/download/fever/shared_task_dev.jsonl
      - https://s3-eu-west-1.amazonaws.com/fever.public/shared_task_dev.jsonl
    wiki-pages.zip:
      - https://fever.ai/download/fever/wiki-pages.zip
      - https://s3-eu-west-1.amazonaws.com/fever.public/wiki-pages.zip
    hotpot_dev_distractor_v1.json:
      - http://curtis.ml.cmu.edu/datasets/hotpot/hotpot_dev_distractor_v1.json
  expected:
    train_total: 145449
    train_labels: {SUPPORTS: 80035, REFUTES: 29775, NOT ENOUGH INFO: 35639}
    dev_total: 19998
    dev_labels: {SUPPORTS: 6666, REFUTES: 6666, NOT ENOUGH INFO: 6666}
    wiki_pages: 5416537
    hotpot_dev_distractor: 7405
  parquet_compression: zstd

splits:
  train_size: 30000
  val_size: 2000
  test_subset_size: 5000      # class-balanced subset of shared-task dev
  test_subset: full           # full | 5k   (read by later scripts)

corpus:
  target_pages: 50000
  max_sentences: 1000000
  decoys_per_claim: 3
  decoy_candidates: 30        # BM25 pages fetched per claim before removing evidence pages
  bm25_k1: 0.9
  bm25_b: 0.4
  bm25_batch_size: 64
  embedding_dim: 384          # for the index-memory estimate
