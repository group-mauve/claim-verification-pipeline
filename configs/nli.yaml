# Prompt 12: NLI verifier and aggregation (owner M4). Needs a GPU.
run_name: verify
seed: 42
test_subset: full

paths:
  outputs_dir: outputs
  search_dirs: [data, outputs, /kaggle/input]

nli:
  main_model: cross-encoder/nli-deberta-v3-base
  compare_model: roberta-large-mnli    # run on compare_split only; set to null to skip
  compare_split: test_5k
  fp16: true
  max_length: 512            # long enough for the concatenated premise of 5 sentences
  batch_size: 64
  threshold_grid: [0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95]
  sources:
    retrieved: {type: run, run: auto, k: 5}
    chain: {type: chain, run: chain}
    oracle: {type: gold, nearest_run: bm25, nei_sentences: 2, k: 5}
  compare_sources: [retrieved, oracle]
  concat_sources: [retrieved, chain]
